<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapay Zeka Seslendirme Stüdyosu</title>
    <style>
        body {
            background-color: #0f172a; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        header { border-bottom: 1px solid #1e293b; padding: 15px; text-align: center; }
        .logo { color: #60a5fa; font-weight: 900; font-size: 24px; margin: 0; }
        main { max-width: 600px; width: 90%; margin: auto; padding: 20px; }
        .studio-card { background-color: #1e293b; padding: 25px; border-radius: 16px; border: 1px solid #334155; }
        textarea {
            width: 100%; height: 120px; background-color: #0f172a; border: 1px solid #334155;
            border-radius: 10px; padding: 12px; color: white; font-size: 15px; outline: none; resize: none;
            box-sizing: border-box; margin-bottom: 15px;
        }
        textarea:focus { border-color: #60a5fa; }
        button {
            width: 100%; background-color: #60a5fa; color: #0f172a; font-weight: bold;
            border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-size: 16px;
        }
        button:hover { background-color: #3b82f6; }
        button:disabled { background-color: #334155; color: #94a3b8; cursor: not-allowed; }
        #audioPlayerContainer { margin-top: 25px; display: none; text-align: center; }
        audio { width: 100%; margin-bottom: 15px; }
        .download-btn {
            display: inline-block; background-color: #10b981; color: white; padding: 10px 20px;
            border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px;
        }
        .download-btn:hover { background-color: #059669; }
        #statusText { text-align: center; color: #94a3b8; font-size: 14px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">🎙️ AI SES STÜDYOSU</h1>
    </header>

    <main>
        <div class="studio-card">
            <h3 style="margin-top: 0; margin-bottom: 15px;">Seslendirilecek Metni Girin:</h3>
            <textarea id="txtInput" placeholder="Yapay zekanın okumasını istediğiniz Türkçe metni buraya yazın..."></textarea>
            <button onclick="generateSpeech()" id="btnAction">Sese Dönüştür 🚀</button>
            
            <div id="statusText">Yapay zeka konuşuyor, lütfen bekleyin...</div>

            <div id="audioPlayerContainer">
                <audio id="audioPlayer" controls></audio>
                <br>
                <a id="downloadLink" href="#" download="ai-seslendirme.mp3" class="download-btn">Ses Dosyasını İndir 📥</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 AI SES. Tüm hakları saklıdır.</p>
    </footer>

    <script>
        async function generateSpeech() {
            const text = document.getElementById('txtInput').value.trim();
            const btnAction = document.getElementById('btnAction');
            const statusText = document.getElementById('statusText');
            const playerContainer = document.getElementById('audioPlayerContainer');
            const audioPlayer = document.getElementById('audioPlayer');
            const downloadLink = document.getElementById('downloadLink');

            if (!text) {
                alert('Lütfen bir metin girin!');
                return;
            }

            btnAction.disabled = true;
            statusText.style.display = 'block';
            playerContainer.style.display = 'none';

            // SENİN YENİ VE TEMİZ API ANATARIN DOĞRUDAN TARAYICIYA BAĞLANDI
            const apiKey = "sk_34d6ccb20fd2701710e8a77db641ddd1308a4f1f6d573b86";
            const url = "https://elevenlabs.io";

            try {
                // İstek Render sunucusuna değil, doğrudan senin internetinden ElevenLabs'e gidiyor!
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'xi-api-key': apiKey
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.5, similarity_boost: 0.75 }
                    })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const audioSrc = URL.createObjectURL(blob);
                    
                    audioPlayer.src = audioSrc;
                    downloadLink.href = audioSrc;
                    
                    playerContainer.style.display = 'block';
                    audioPlayer.play();
                } else {
                    const errText = await response.text();
                    alert('ElevenLabs Hatası: ' + errText);
                }
            } catch (error) {
                console.error(error);
                alert('Bağlantı hatası yaşandı!');
            } finally {
                btnAction.disabled = false;
                statusText.style.display = 'none';
            }
        }
    </script>
</body>
</html>
