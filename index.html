<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hızlı Video İndirici (SaveFrom Tarzı)</title>
    <!-- Modern Görünüm İçin Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col justify-between">

    <!-- Üst Logo / Başlık Alanı -->
    <header class="border-b border-slate-800 p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-emerald-400 tracking-wider">⚡ VIDEOINDİR</h1>
            <span class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded">v1.0 - Ücretsiz</span>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="max-w-3xl w-full mx-auto p-4 my-auto">
        <div class="text-center mb-8">
            <h2 class="text-3xl md:text-4xl font-extrabold mb-3">İnternetteki Her Videoyu İndirin</h2>
            <p class="text-slate-400 text-sm md:text-base">YouTube, Instagram ve daha yüzlerce siteden anında video indirin.</p>
        </div>

        <!-- Arama Kutusu -->
        <div class="bg-slate-800 p-4 rounded-2xl shadow-2xl border border-slate-700">
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="videoUrl" placeholder="Video linkini buraya yapıştırın (Örn: https://youtube.com...)" 
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-emerald-500 transition text-sm">
                <button onclick="analyzeVideo()" id="btnAction" class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold px-8 py-3.5 rounded-xl transition duration-200 shadow-lg shadow-emerald-500/20 whitespace-nowrap">
                    Videoyu Çöz
                </button>
            </div>
        </div>

        <!-- Yükleniyor Döngüsü (Başlangıçta Gizli) -->
        <div id="loader" class="hidden text-center my-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent mb-2"></div>
            <p class="text-slate-400 text-sm">Video sunucuda analiz ediliyor, lütfen bekleyin...</p>
        </div>

        <!-- Sonuç Penceresi (Başlangıçta Gizli) -->
        <div id="resultBox" class="hidden mt-8 bg-slate-800 p-6 rounded-2xl border border-slate-700">
            <div class="flex flex-col md:flex-row gap-6">
                <!-- Video Küçük Resmi -->
                <img id="vThumbnail" src="" alt="Kapak" class="w-full md:w-56 h-auto object-cover rounded-xl border border-slate-700 shadow-md">
                
                <!-- Video Bilgileri -->
                <div class="flex-1 flex flex-col justify-between">
                    <div>
                        <h3 id="vTitle" class="text-lg font-bold text-slate-100 mb-2 leading-snug">Video Başlığı</h3>
                        <p id="vDuration" class="text-xs text-slate-400 inline-block bg-slate-900 px-2 py-1 rounded">Süre: 00:00</p>
                    </div>

                    <!-- İndirme Linkleri Listesi -->
                    <div class="mt-4">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Kullanılabilir Formatlar:</label>
                        <div id="downloadLinks" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <!-- Butonlar JavaScript ile buraya basılacak -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 p-4 text-center text-xs text-slate-500">
        <p>&copy; 2026 VIDEOINDİR. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Akıllı JavaScript Entegrasyonu -->
    <script>
        async function analyzeVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const btnAction = document.getElementById('btnAction');
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');
            const downloadLinks = document.getElementById('downloadLinks');

            if (!urlInput) {
                alert('Lütfen geçerli bir video linki girin!');
                return;
            }

            // Arayüzü yükleniyor moduna al
            btnAction.disabled = true;
            loader.classList.remove('hidden');
            resultBox.classList.add('hidden');
            downloadLinks.innerHTML = '';

            try {
                // Lokalde de, canlı sunucuda da (Render) hata vermeden çalışması için bağımsız yönlendirme
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Gelen verileri ekrana doldur
                    document.getElementById('vTitle').innerText = data.title;
                    document.getElementById('vThumbnail').src = data.thumbnail;
                    document.getElementById('vDuration').innerText = `Süre: ${data.duration}`;

                    // İndirme butonlarını tek tek oluştur
                    data.links.forEach(link => {
                        const btn = document.createElement('a');
                        btn.href = link.download_url;
                        btn.target = '_blank';
                        btn.setAttribute('download', `${data.title}.${link.ext}`);
                        btn.className = "flex justify-between items-center bg-slate-900 hover:bg-emerald-500 hover:text-slate-900 border border-slate-700 px-4 py-2.5 rounded-xl text-sm font-semibold transition duration-150 group";
                        
                        btn.innerHTML = `
                            <span>🎬 ${link.quality} (${link.ext.toUpperCase()})</span>
                            <span class="text-xs text-slate-400 group-hover:text-slate-950 font-normal">İndir 📥</span>
                        `;
                        downloadLinks.appendChild(btn);
                    });

                    // Sonuç kutusunu görünür yap
                    resultBox.classList.remove('hidden');
                } else {
                    alert(data.detail || 'Bir hata oluştu. Lütfen linki kontrol edin veya daha sonra tekrar deneyin.');
                }
            } catch (error) {
                console.error(error);
                alert('Bağlantı hatası! Sunucu şu an isteklere cevap veremiyor.');
            } finally {
                // Arayüzü eski haline döndür
                btnAction.disabled = false;
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
