<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapay Zeka Seslendirme Stüdyosu</title>
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        header { border-bottom: 1px solid #1e293b; padding: 15px; text-align: center; }
        .logo { color: #60a5fa; font-weight: 900; font-size: 24px; margin: 0; }
        main { max-width: 600px; width: 90%; margin: auto; padding: 20px; }
        .studio-card { background-color: #1e293b; padding: 25px; border-radius: 16px; border: 1px solid #334155; }
        textarea { width: 100%; height: 120px; background-color: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; color: white; font-size: 15px; outline: none; resize: none; box-sizing: border-box; margin-bottom: 15px; }
        textarea:focus { border-color: #60a5fa; }
        button { width: 100%; background-color: #60a5fa; color: #0f172a; font-weight: bold; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #3b82f6; }
        button:disabled { background-color: #334155; color: #94a3b8; cursor: not-allowed; }
        #audioPlayerContainer { margin-top: 25px; display: none; text-align: center; }
        audio { width: 100%; margin-bottom: 15px; }
        .download-btn { display: inline-block; background-color: #10b981; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .download-btn:hover { background-color: #059669; }
        #statusText { text-align: center; color: #94a3b8; font-size: 14px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <header><h1 class="logo">🎙️ AI SES STÜDYOSU</h1></header>
    <main>
        <div class="studio-card">
            <h3 style="margin-top:0; margin-bottom:15px;">Seslendirilecek Metni Girin:</h3>
            <textarea id="txtInput" placeholder="Yapay zekanın okumasını istediğiniz Türkçe metni buraya yazın..."></textarea>
            <button onclick="generateSpeech()" id="btnAction">Sese Dönüştür 🚀</button>
            <div id="statusText">Yapay zeka konuşuyor, lütfen bekleyin...</div>
            <div id="audioPlayerContainer">
                <audio id="audioPlayer" controls preload="none"></audio><br>
                <a id="downloadLink" href="#" download="ai-seslendirme.mp3" class="download-btn">Ses Dosyasını İndir 📥</a>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 AI SES. Tüm hakları saklıdır.</p></footer>
    <script>
        function generateSpeech() {
            const text = document.getElementById('txtInput').value.trim();
            const btnAction = document.getElementById('btnAction');
            const statusText = document.getElementById('statusText');
            const playerContainer = document.getElementById('audioPlayerContainer');
            const audioPlayer = document.getElementById('audioPlayer');
            const downloadLink = document.getElementById('downloadLink');

            if (!text) { alert('Lütfen bir metin girin!'); return; }

            // Butonu kilitle ve yükleniyor animasyonunu göster
            btnAction.disabled = true;
            statusText.style.display = 'block';
            playerContainer.style.display = 'none';

            // Tarayıcıyı doğrudan bizim StreamingResponse veren API adresimize bağlıyoruz!
            // Metni URL parametresi olarak güvenli bir şekilde sunucuya basıyoruz
            const streamUrl = `/api/tts?text=${encodeURIComponent(text)}`;
            
            // Oynatıcı kaynağını ve indirme linkini doğrudan bu akışa eşitliyoruz
            audioPlayer.src = streamUrl;
            downloadLink.href = streamUrl;
            
            // Arayüzü aç ve oynatmayı zorla
            playerContainer.style.display = 'block';
            statusText.style.display = 'none';
            btnAction.disabled = false;
            
            // Tarayıcı sunucudan gelen akışı anında çalmaya başlar
            audioPlayer.load();
            audioPlayer.play().catch(e => console.log("İlk tıklamada oynatma tetiklendi, oynata basın."));
        }
    </script>
</body>
</html>
